[package]
name = "settl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small TOML config loader for Rust apps, with typed Color and KeyChord primitives."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/MAster-588/settl"
keywords = ["config", "toml", "serde", "keybindings", "color"]
categories = ["config", "parsing"]

[dependencies]
serde = { version = "1", features = ["derive"] }   # struct (de)serialization; consumers derive on their config
toml = "1"                                         # parse/emit TOML, with line-numbered parse errors
directories = "6"                                  # XDG config path resolution
thiserror = "2"                                    # ergonomic Error enum
tempfile = "3"                                     # atomic, no-clobber first-run config creation

[dev-dependencies]
proptest = "1" # property-based round-trip tests for Color / KeyChord
